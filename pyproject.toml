[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-domain-claim"
version = "0.1.0"
description = "Track Alpha: Public registry website telemetry, DNS/RDAP status, Wayback CDX indexing, and research state tracking."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ngo-domain-claim = "ngo_domain_claim.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-domain-claim"
version = "0.2.0"
description = "Configurable public charity registry website-surface OSINT scanner, IANA RDAP verifier, Wayback CDX profiler, and research state store."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ngo-domain-claim = "ngo_domain_claim.cli:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
